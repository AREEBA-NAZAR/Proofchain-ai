name: Bug report
description: Report a reproducible problem.
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open... 2. Upload... 3. See error...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, OS, network, app version
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove private keys, tokens, and personal file contents.
