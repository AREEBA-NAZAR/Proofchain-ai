name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: proofchain/contracts/package-lock.json
      - run: npm ci
        working-directory: proofchain/contracts
      - run: npx hardhat test
        working-directory: proofchain/contracts

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: proofchain/backend/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: proofchain/backend
      - run: python -m pytest -q
        working-directory: proofchain/backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: proofchain/frontend/package-lock.json
      - run: npm ci
        working-directory: proofchain/frontend
      - run: npm run build
        working-directory: proofchain/frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
