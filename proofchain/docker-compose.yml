# Production-style stack. Copy .env.production.example to .env, fill the domain,
# database password and Sepolia RPC URL, then deploy the contract before `up`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: proofchain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: proofchain
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofchain -d proofchain"]
      interval: 5s
      timeout: 3s
      retries: 12

  ipfs:
    image: ipfs/kubo:latest
    ports:
      - "127.0.0.1:5001:5001" # API (keep private)
      - "127.0.0.1:8080:8080" # gateway
    volumes:
      - ipfsdata:/data/ipfs

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --proxy-headers
      - --forwarded-allow-ips=172.29.240.0/24
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://proofchain:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/proofchain
      IPFS_API_URL: http://ipfs:5001
      RATE_LIMIT_REDIS_URL: redis://redis:6379/0
      DEPLOYMENT_FILE: /contracts/deployments/sepolia.json
      INDEXER_ENABLED: "true"
      WALLET_AUTH_REQUIRED: "true"
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Set AUTH_TOKEN_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ipfs:
        condition: service_started
    volumes:
      - backend-data:/app/data
      - ./backend/models:/app/models:ro
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-}
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  pgdata:
  ipfsdata:
  backend-data:
  caddy_data:
  caddy_config:

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.240.0/24
